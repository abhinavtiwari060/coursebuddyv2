<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon-192.svg" />
    <link rel="apple-touch-icon" href="/icon-192.svg">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#EA580C" />
    <meta name="description" content="StudyMate – Smart, distraction-free study platform for curriculum tracking and consistency." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&family=Outfit:wght@700;900&display=swap" rel="stylesheet" />
    <title>StudyMate</title>
  </head>
  <body style="margin:0;padding:0;background-color:#FFF7ED;">
    <!-- Modern Clean Initial Loader (Zero gradients, minimal orange-and-white theme) -->
    <div id="splash-screen" style="position:fixed;inset:0;background-color:#FFF7ED;display:flex;flex-direction:column;justify-content:center;align-items:center;z-index:9999;transition:opacity 0.25s ease-out;">
      <div style="display:flex;flex-direction:column;align-items:center;gap:12px;">
        <span style="font-family:'Outfit', sans-serif;font-size:26px;font-weight:900;letter-spacing:-0.03em;color:#431407;">
          Study<span style="color:#EA580C;">Mate</span>
        </span>
        <div style="width:48px;height:3px;background-color:#FED7AA;border-radius:99px;overflow:hidden;position:relative;">
          <div style="position:absolute;top:0;left:0;bottom:0;width:40%;background-color:#EA580C;border-radius:99px;animation:studymate-pulse 1s ease-in-out infinite alternate;"></div>
        </div>
      </div>
    </div>
    <style>
      @keyframes studymate-pulse {
        0% { left: 0%; width: 30%; }
        100% { left: 70%; width: 30%; }
      }
      @media (prefers-reduced-motion: reduce) {
        #splash-screen * { animation: none !important; }
      }
    </style>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // Clean fast dismissal once app script evaluates
      window.addEventListener('DOMContentLoaded', () => {
        const splash = document.getElementById('splash-screen');
        if (splash) {
          setTimeout(() => {
            splash.style.opacity = '0';
            setTimeout(() => splash.remove(), 250);
          }, 150);
        }
      });
    </script>
  </body>
</html>
